<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1c7a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preload" href="/fonts/cairo-arabic-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<meta name="robots" content="noindex">
<title>الإدارة · معرض الابتكار المفتوح</title>
<style>
  main.wrap{max-width:1100px}
  .sess{padding:18px;margin-top:16px}
  .sess-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .sess-h h3{font-size:20px;font-weight:700}
  .state{font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:20px;border:1.5px solid}
  .state.open{color:var(--mint);border-color:var(--mint)}.state.frozen{color:var(--gold);border-color:var(--gold)}
  .state.draft{color:var(--lav);border-color:var(--lav)}.state.closed{color:#ff9ae8;border-color:#ff9ae8}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
  .kpis div{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06)}
  .kpis b{display:block;font-family:"Inter";font-weight:800;font-size:22px}
  .kpis small{color:var(--lav);font-size:12.5px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .acts .btn{width:auto}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid rgba(207,198,255,.2);text-align:right}
  th{color:var(--lav);font-weight:600;font-size:12.5px}
  td.num{font-family:"Inter"}
  .tbl{overflow-x:auto}
  dialog{margin:auto;border:1.5px solid var(--panel-line);border-radius:22px;background:#1a1158;color:var(--ink);padding:22px;max-width:min(520px,calc(100vw - 32px));width:100%}
  dialog::backdrop{background:rgba(5,2,30,.7)}
  .winner{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(207,198,255,.2)}
  .winner .badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:"Inter";font-weight:800;color:#2a1c00;background:var(--gold);flex:none}
  .row2{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
  @media (max-width:600px){.row2{grid-template-columns:1fr}}
  .an h4{font-size:15px;font-weight:700;margin-top:18px}
  .an-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
  .an-kpi{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06)}
  .an-kpi b{display:block;font-family:"Inter";font-weight:800;font-size:28px;line-height:1.2}
  .an-kpi small{display:block;color:var(--ink);font-size:13px;font-weight:600}
  .an-kpi i{display:block;font-style:normal;color:var(--lav2);font-size:12px}
  .an-chart{position:relative;margin-top:8px;direction:ltr}
  .an-svg{display:block;width:100%;height:auto;overflow:visible}
  .an-grid{stroke:rgba(207,198,255,.14);stroke-width:1}
  .an-base{stroke:rgba(207,198,255,.45);stroke-width:1}
  .an-tick{fill:var(--lav2);font:500 11px "Inter",sans-serif}
  .an-peak{fill:var(--ink);font:700 12px "Inter",sans-serif}
  .an-hit{cursor:default}.an-hit.on rect{fill:rgba(255,255,255,.06)}.an-hit.on .an-bar{filter:brightness(1.15)}
  .an-tip{position:absolute;top:0;transform:translate(-50%,calc(-100% - 10px));pointer-events:none;opacity:0;transition:opacity .12s;
    background:#0d0838;border:1px solid var(--panel-line);border-radius:10px;padding:6px 10px;font-size:12.5px;white-space:nowrap;direction:rtl;text-align:center}
  .an-tip.on{opacity:1}.an-tip b{display:block;font-size:13px}
  @media (max-width:600px){.an-tick{font-size:21px}.an-peak{font-size:22px}}
  .an-table{margin-top:6px;font-size:13px;color:var(--lav2)}.an-table summary{cursor:pointer}
  .an-split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:700px){.an-split{grid-template-columns:1fr}}
  .an-bars{margin-top:8px;display:grid;gap:8px}
  .an-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 34px 34px;gap:8px;align-items:center;font-size:13.5px}
  .an-row b{font-family:"Inter";text-align:left}.an-row small{color:var(--lav2);text-align:left;font-size:12px}
  .an-track{height:10px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
  .an-fill{display:block;height:100%;border-radius:4px;background:var(--lav2)}
  .an-moments{list-style:none;margin-top:10px;display:grid;gap:2px;border-inline-start:2px solid rgba(207,198,255,.25);padding-inline-start:14px}
  .an-moments li{display:flex;gap:12px;align-items:baseline;font-size:14px;padding:3px 0;position:relative}
  .an-moments li::before{content:"";position:absolute;inset-inline-start:-19px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--mint)}
  .an-moments b{font-family:"Inter";min-width:42px;color:var(--mint)}
</style>
</head>
<body>
<main class="wrap">
  <p class="tag">ADMIN · STATION 01</p>
  <h2 style="margin-top:6px">لوحة الإدارة</h2>
  <form id="login" class="panel" style="padding:4px 18px 20px;margin:18px auto 0;max-width:420px">
    <label class="field"><span>رمز الإدارة</span><input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn" type="submit">دخول</button>
  </form>
  <section id="app" class="hide">
    <div id="stats"></div>
    <div id="sessions"></div>
    <div class="panel sess">
      <h3 style="font-size:18px">فترة جديدة</h3>
      <form id="newsess" class="row2">
        <label class="field"><span>المعرّف (مثل f2)</span><input name="id" dir="ltr" pattern="[a-z0-9]{1,12}" required></label>
        <label class="field"><span>الاسم الظاهر</span><input name="label" required></label>
        <button class="btn sm" type="submit" style="height:54px">إنشاء</button>
      </form>
    </div>
    <div class="panel sess">
      <h3 style="font-size:18px">بعد الفعالية</h3>
      <p class="muted" style="margin-top:6px">تُحذف أرقام الجوال من كل الفترات والاستبيان بعد أسبوع من الفعالية. تبقى الأسماء والنتائج للتقرير.</p>
      <div class="acts"><button class="btn danger sm" id="purge" type="button">حذف أرقام الجوال</button><button class="btn ghost sm" id="logout" type="button">خروج</button></div>
    </div>
  </section>
</main>
<dialog id="dlg"></dialog>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
